name: Deploy Pizza Club Web PWA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-github-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject optional Supabase DB config
        env:
          DB_CONFIG_JS: ${{ secrets.DB_CONFIG_JS }}
        run: |
          if [ -n "$DB_CONFIG_JS" ]; then
            printf '%s\n' "$DB_CONFIG_JS" > web-pwa/db-config.js
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web-pwa artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-pwa

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
